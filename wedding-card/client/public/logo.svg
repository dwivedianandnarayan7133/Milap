<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="vpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>

    <!-- Deep Royal Velvet Maroon Radial Gradient -->
    <radialGradient id="vpMaroon" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7B142A" />
      <stop offset="70%" stop-color="#540A18" />
      <stop offset="100%" stop-color="#2D030A" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Auspicious Ring -->
  <circle cx="60" cy="60" r="57" fill="url(#vpMaroon)" stroke="url(#vpGold)" stroke-width="2.5" />
  
  <!-- Intricate Filigree Ring (Dash Array) -->
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="url(#vpGold)" stroke-width="0.75" stroke-dasharray="2.5 1.5" />
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#vpGold)" stroke-width="0.5" opacity="0.6" />

  <!-- 12 Auspicious Pearls Around Rim -->
  <g fill="url(#vpGold)">
    <circle cx="60" cy="8.5" r="1.5" />
    <circle cx="85.7" cy="15.3" r="1.5" />
    <circle cx="104.7" cy="34.3" r="1.5" />
    <circle cx="111.5" cy="60" r="1.5" />
    <circle cx="104.7" cy="85.7" r="1.5" />
    <circle cx="85.7" cy="104.7" r="1.5" />
    <circle cx="60" cy="111.5" r="1.5" />
    <circle cx="34.3" cy="104.7" r="1.5" />
    <circle cx="15.3" cy="85.7" r="1.5" />
    <circle cx="8.5" cy="60" r="1.5" />
    <circle cx="15.3" cy="34.3" r="1.5" />
    <circle cx="34.3" cy="15.3" r="1.5" />
  </g>

  <!-- Sacred Royal Kalash & Lotus Blossom Artwork -->
  <g id="kalashMotif" filter="url(#goldGlow)">
    <!-- Kalash Coconut Finial & Mango Leaves -->
    <!-- Coconut -->
    <path d="M60 21 C66 29 74 38 70 45 C66 48 54 48 50 45 C46 38 54 29 60 21 Z" fill="url(#vpGold)" />
    <!-- Center Spire -->
    <path d="M60 13 L62 23 L58 23 Z" fill="url(#vpGold)" />
    <circle cx="60" cy="13" r="2" fill="url(#vpGold)" />

    <!-- Left Mango Leaf -->
    <path d="M52 41 C40 34 30 40 28 48 C37 51 46 47 52 43 Z" fill="url(#vpGold)" opacity="0.95" />
    <!-- Right Mango Leaf -->
    <path d="M68 41 C80 34 90 40 92 48 C83 51 74 47 68 43 Z" fill="url(#vpGold)" opacity="0.95" />

    <!-- Sacred Kalash Rim & Thread (Mauli) -->
    <path d="M43 47 C43 45 77 45 77 47 L74 53 L46 53 Z" fill="url(#vpGold)" />
    <line x1="44" y1="50" x2="76" y2="50" stroke="#2D030A" stroke-width="1.2" />

    <!-- Kalash Body -->
    <path d="M46 53 C33 59 31 77 41 85 C49 91 71 91 79 85 C89 77 87 59 74 53 Z" fill="url(#vpGold)" />

    <!-- Decorative Engraving on Kalash (Center Lotus / Swastik) -->
    <!-- Inner Lotus Petal on Pot -->
    <path d="M60 59 C64 65 67 72 60 80 C53 72 56 65 60 59 Z" fill="#540A18" />
    <path d="M59 64 C55 67 51 72 54 77 C57 74 59 70 59 64 Z" fill="#540A18" opacity="0.8" />
    <path d="M61 64 C65 67 69 72 66 77 C63 74 61 70 61 64 Z" fill="#540A18" opacity="0.8" />
    <circle cx="60" cy="74" r="1.5" fill="url(#vpGold)" />

    <!-- Base Pedestal -->
    <path d="M46 87 H74 L71 93 H49 Z" fill="url(#vpGold)" />
    <rect x="44" y="93" width="32" height="2" rx="1" fill="url(#vpGold)" />
  </g>
</svg>
